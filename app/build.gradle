plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.overtone.player'
    compileSdk 36
    defaultConfig {
        applicationId 'com.overtone.player'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '0.11.4'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
}
dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-core:1.8.1"
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.9.0' 
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation "androidx.compose.ui:ui:1.8.2"
    implementation "androidx.compose.animation:animation:1.8.2"
    implementation "androidx.compose.foundation:foundation:1.8.2"
    implementation "androidx.compose.material:material-ripple:1.8.2"
    implementation 'androidx.media3:media3-exoplayer:1.7.1'
    implementation 'androidx.media3:media3-session:1.7.1'
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.6.1+1"
}
